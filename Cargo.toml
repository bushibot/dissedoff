[workspace]
resolver = "2"
members = [
    "server",
    "crates/protocol",
    "crates/permissions",
    "crates/client-core",
    "apps/cli",
]

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://example.invalid/dissedoff"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
