[package]
name = "dissedoff-client-core"
version = "0.1.0"
edition.workspace = true
license = "Apache-2.0"
description = "Gateway connection state machine and local cache, shared by every Dissedoff client (Tauri desktop/mobile, and any future native client)."

[dependencies]
dissedoff-protocol = { path = "../protocol" }
dissedoff-permissions = { path = "../permissions" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
thiserror = "2"
