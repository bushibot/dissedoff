[package]
name = "dissedoff-server"
version = "0.2.0"
edition.workspace = true
license = "AGPL-3.0-or-later"
description = "The single-binary Dissedoff server: REST API, WebSocket gateway, auth, permissions, messaging/media, and (later) the embedded Murmur voice supervisor."

[dependencies]
dissedoff-protocol = { path = "../crates/protocol" }
dissedoff-permissions = { path = "../crates/permissions" }
tokio = { workspace = true }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors"] }
serde = { workspace = true }
serde_json = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
bs58 = "0.5"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
argon2 = "0.5"
base64 = "0.22"
futures-util = "0.3"
tokio-stream = "0.1"
hex = "0.4"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.24"
tempfile = "3"
