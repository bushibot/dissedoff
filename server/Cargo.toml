[package]
name = "dissedoff-server"
version = "0.1.0"
edition.workspace = true
license = "AGPL-3.0-or-later"
description = "The single-binary Dissedoff server: REST API, WebSocket gateway, auth, permissions, messaging/media, and (later) the embedded Murmur voice supervisor."

[dependencies]
dissedoff-protocol = { path = "../crates/protocol" }
dissedoff-permissions = { path = "../crates/permissions" }
tokio = { workspace = true }
axum = "0.7"
serde = { workspace = true }
serde_json = { workspace = true }
hmac = "0.12"
sha2 = "0.10"
bs58 = "0.5"
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
hex = "0.4"
