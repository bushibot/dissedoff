<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dissedoff</title>
<style>
  :root {
    --bg: #1e1f26; --panel: #262832; --panel-2: #2e3040; --text: #e6e6ea;
    --muted: #9a9ba8; --accent: #7289da; --danger: #e05c5c; --border: #3a3c4a;
    --rail: #16171c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
  #auth-screen { display: flex; align-items: center; justify-content: center; height: 100vh; }
  .card { background: var(--panel); padding: 2rem; border-radius: 8px; width: 320px; }
  .card h1 { margin-top: 0; font-size: 1.3rem; }
  .card input { width: 100%; padding: 0.5rem; margin-bottom: 0.6rem; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); }
  .card button { width: 100%; padding: 0.55rem; background: var(--accent); border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: 600; }
  .card button:hover { opacity: 0.9; }
  .card .error { color: var(--danger); font-size: 0.85rem; min-height: 1.2em; }
  .card input.input-error { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); }
  .card .switch { text-align: center; margin-top: 0.5rem; font-size: 0.85rem; color: var(--muted); cursor: pointer; }
  #app { display: none; height: 100vh; }
  .layout { display: flex; height: 100%; }
  .server-rail { width: 64px; flex-shrink: 0; background: var(--rail); display: flex; flex-direction: column; align-items: center; padding: 0.6rem 0; gap: 0.5rem; overflow-y: auto; }
  .server-icon { width: 44px; height: 44px; min-height: 44px; border-radius: 50%; background: var(--panel-2); color: var(--text); display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; font-size: 1rem; transition: border-radius 0.15s; }
  .server-icon:hover { background: var(--accent); }
  .server-icon.active { background: var(--accent); border-radius: 16px; }
  .server-icon.add { background: var(--panel); color: var(--accent); font-size: 1.4rem; border: 1px dashed var(--border); }
  .sidebar { width: 220px; flex-shrink: 0; background: var(--panel); display: flex; flex-direction: column; border-right: 1px solid var(--border); }
  .server-header { padding: 0.9rem; border-bottom: 1px solid var(--border); }
  .server-header .name { font-weight: 700; }
  .server-header .desc { color: var(--muted); font-size: 0.8rem; margin-top: 0.2rem; }
  .channels { flex: 1; overflow-y: auto; padding: 0.5rem; }
  .channel { padding: 0.4rem 0.6rem; border-radius: 4px; cursor: pointer; color: var(--muted); font-size: 0.92rem; }
  .channel.active { background: var(--panel-2); color: var(--text); }
  .channel:hover { background: var(--panel-2); }
  .new-channel { display: flex; gap: 0.3rem; padding: 0.5rem; }
  .new-channel input { flex: 1; min-width: 0; padding: 0.35rem; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 0.85rem; }
  .new-channel input.input-error { border-color: var(--danger); box-shadow: 0 0 0 1px var(--danger); animation: shake 0.3s; }
  @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  .new-channel select { padding: 0.3rem; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 0.78rem; }
  .new-channel button { padding: 0.35rem 0.5rem; background: var(--accent); border: none; border-radius: 4px; color: white; cursor: pointer; }
  .voice-panel { flex: 1; overflow-y: auto; }
  .voice-panel .box { padding: 1.5rem; color: var(--muted); max-width: 440px; line-height: 1.5; }
  .voice-panel .box h2 { color: var(--text); font-size: 1.05rem; margin: 0 0 0.6rem; }
  .voice-panel .box code { display: block; background: var(--panel-2); padding: 0.5rem 0.7rem; border-radius: 4px; font-size: 0.95rem; margin: 0.6rem 0; color: var(--text); }
  .voice-panel .box a { color: var(--accent); }
  .voice-status { padding: 0.6rem; border-top: 1px solid var(--border); font-size: 0.78rem; color: var(--muted); }
  .voice-status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 0.35rem; }
  .user-footer { padding: 0.6rem; border-top: 1px solid var(--border); font-size: 0.82rem; display: flex; justify-content: space-between; align-items: center; }
  .user-footer button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 0.78rem; }
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .main-header { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border); font-weight: 600; }
  .messages { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
  .msg .author { font-weight: 700; margin-right: 0.4rem; }
  .msg .time { color: var(--muted); font-size: 0.72rem; margin-left: 0.4rem; }
  .msg .edited-tag { color: var(--muted); font-size: 0.72rem; font-style: italic; }
  .msg .edit-input { width: 100%; margin-top: 0.2rem; padding: 0.3rem; background: var(--panel-2); border: 1px solid var(--accent); border-radius: 4px; color: var(--text); font-size: 0.95rem; }
  .typing { padding: 0.15rem 1rem; font-size: 0.78rem; color: var(--muted); font-style: italic; min-height: 1.1em; }
  .composer { padding: 0.8rem 1rem; border-top: 1px solid var(--border); display: flex; gap: 0.5rem; }
  .composer input { flex: 1; padding: 0.6rem; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); }
  .composer button { padding: 0.6rem 1rem; background: var(--accent); border: none; border-radius: 4px; color: white; cursor: pointer; }
  .banner { padding: 0.4rem 1rem; font-size: 0.8rem; background: #3a2d2d; color: #e0a0a0; }
  .hidden { display: none !important; }
  .context-menu { position: fixed; background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 0.3rem; z-index: 1000; min-width: 160px; box-shadow: 0 4px 16px rgba(0,0,0,0.45); }
  .context-menu .item { padding: 0.45rem 0.7rem; font-size: 0.85rem; cursor: pointer; border-radius: 4px; color: var(--text); }
  .context-menu .item:hover { background: var(--accent); }
  .context-menu .item.danger { color: var(--danger); }
  .context-menu .item.danger:hover { background: var(--danger); color: white; }
</style>
</head>
<body>

<div id="auth-screen">
  <div class="card">
    <h1 id="auth-title">Sign in to Dissedoff</h1>
    <input id="auth-server" placeholder="Server URL (e.g. http://127.0.0.1:8080)" />
    <input id="auth-username" placeholder="Username (leave blank to auto-generate, register only)" />
    <input id="auth-password" type="password" placeholder="Password (min 8 characters)" />
    <button id="auth-submit">Sign in</button>
    <div class="error" id="auth-error"></div>
    <div class="switch" id="auth-switch">Need an account? Register instead</div>
    <div class="switch hidden" id="auth-cancel">Cancel</div>
  </div>
</div>

<div id="app">
  <div class="layout">
    <div class="server-rail" id="server-rail"></div>
    <div class="sidebar">
      <div class="server-header">
        <div class="name" id="server-name">...</div>
        <div class="desc" id="server-desc"></div>
      </div>
      <div class="channels" id="channel-list"></div>
      <div class="new-channel">
        <input id="new-channel-name" placeholder="new channel" />
        <select id="new-channel-kind">
          <option value="text"># text</option>
          <option value="voice">&#128266; voice</option>
        </select>
        <button id="new-channel-submit">+</button>
      </div>
      <div class="voice-status" id="voice-status">voice: checking...</div>
      <div class="user-footer">
        <span id="whoami"></span>
        <button id="logout-btn">disconnect</button>
      </div>
    </div>
    <div class="main">
      <div class="main-header" id="main-header">#</div>
      <div class="banner hidden" id="banner"></div>
      <div class="messages" id="messages"></div>
      <div class="voice-panel hidden" id="voice-panel"></div>
      <div class="typing" id="typing-indicator"></div>
      <div class="composer" id="composer">
        <input id="composer-input" placeholder="Message..." autocomplete="off" />
        <button id="composer-send">Send</button>
      </div>
    </div>
  </div>
</div>

<div id="context-menu" class="context-menu hidden"></div>

<script>
// Dissedoff web client/admin UI — talks only to the public REST+WS API
// documented in crates/protocol/src/rest.rs and lib.rs. No private endpoints.
//
// Supports multiple independent server connections (each its own account,
// since federation doesn't exist yet — there's no single identity shared
// across deployments). The server-rail on the left is the switcher,
// matching the "jump between servers" request directly: each saved
// connection is {url, token, username, name}, persisted as a JSON array in
// localStorage, never on any server.
(function () {
  function loadServers() {
    try {
      const raw = localStorage.getItem('dissedoff_servers');
      if (raw) return JSON.parse(raw);
    } catch (_) {}
    // Migrate the pre-multi-server single-connection keys this UI used to
    // write, so an existing user's saved login isn't silently dropped.
    const legacyUrl = localStorage.getItem('dissedoff_server_url');
    const legacyToken = localStorage.getItem('dissedoff_token');
    const legacyUsername = localStorage.getItem('dissedoff_username');
    if (legacyUrl && legacyToken && legacyUsername) {
      return [{ url: legacyUrl, token: legacyToken, username: legacyUsername, name: null }];
    }
    return [];
  }

  const state = {
    // Unlike the server's own bundled copy of this page (served same-origin
    // at `/`), the desktop app has no "home" server — window.location.origin
    // here is the webview's internal origin (e.g. tauri://localhost), not a
    // Dissedoff server. Default to empty so the auth screen's server field
    // starts blank instead of showing a misleading internal URL.
    serverUrl: '',
    token: null,
    username: null,
    mode: 'login',
    servers: loadServers(),
    activeServerIndex: -1,
    addingServer: false,
    channels: [],
    activeChannel: null,
    voicePort: null,
    ws: null,
    voiceStatusTimer: null,
    typingTimers: {},
  };

  const el = (id) => document.getElementById(id);

  function saveServers() { localStorage.setItem('dissedoff_servers', JSON.stringify(state.servers)); }

  function api(path, opts = {}) {
    const headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    if (state.token) headers['Authorization'] = `Bearer ${state.token}`;
    return fetch(state.serverUrl + path, Object.assign({}, opts, { headers })).then(async (res) => {
      if (!res.ok) {
        let body;
        try { body = await res.json(); } catch (_) { body = { message: res.statusText }; }
        throw new Error(body.message || `HTTP ${res.status}`);
      }
      if (res.status === 204) return null;
      return res.json();
    });
  }

  function showAuthError(msg) { el('auth-error').textContent = msg || ''; }

  // Field-level error highlight: marks exactly which input is at fault,
  // rather than leaving the user to guess from a one-line message above
  // three fields. Cleared on the next edit to that field.
  function markFieldError(input) { input.classList.add('input-error'); }
  function clearFieldErrors() {
    el('auth-server').classList.remove('input-error');
    el('auth-password').classList.remove('input-error');
  }
  el('auth-server').addEventListener('input', () => el('auth-server').classList.remove('input-error'));
  el('auth-password').addEventListener('input', () => el('auth-password').classList.remove('input-error'));

  // Users routinely type "192.168.1.99:8080" or "myhost.local" without a
  // scheme. Browsers' URL parser then reads the leading digits/host as an
  // invalid scheme and throws a cryptic "string did not match the expected
  // pattern" TypeError — technically correct, useless to a human. Default
  // to http:// (self-hosted Dissedoff servers aren't expected to have a
  // cert) instead of surfacing that error, same as most browsers' own
  // address bar does for bare host:port input.
  function normalizeServerUrl(raw) {
    const trimmed = raw.trim();
    if (!trimmed) return null;
    const withScheme = /^[a-z][a-z0-9+.-]*:\/\//i.test(trimmed) ? trimmed : `http://${trimmed}`;
    return withScheme.replace(/\/+$/, '');
  }

  el('auth-switch').addEventListener('click', () => {
    state.mode = state.mode === 'login' ? 'register' : 'login';
    el('auth-title').textContent = state.mode === 'login' ? 'Sign in to Dissedoff' : 'Register a new account';
    el('auth-submit').textContent = state.mode === 'login' ? 'Sign in' : 'Register';
    el('auth-switch').textContent = state.mode === 'login' ? 'Need an account? Register instead' : 'Already have an account? Sign in';
    showAuthError('');
    clearFieldErrors();
  });

  el('auth-cancel').addEventListener('click', () => {
    state.addingServer = false;
    el('auth-screen').style.display = 'none';
    el('app').style.display = 'block';
  });

  el('auth-submit').addEventListener('click', async () => {
    showAuthError('');
    clearFieldErrors();
    const rawServer = el('auth-server').value.trim() || state.serverUrl;
    const username = el('auth-username').value.trim();
    const password = el('auth-password').value;

    const normalized = normalizeServerUrl(rawServer);
    if (!normalized) {
      showAuthError('Server URL is required — e.g. http://127.0.0.1:8080');
      markFieldError(el('auth-server'));
      el('auth-server').focus();
      return;
    }
    let parsed;
    try {
      parsed = new URL(normalized);
    } catch (_) {
      showAuthError(`"${rawServer}" doesn't look like a valid server address — try something like http://192.168.1.99:8080`);
      markFieldError(el('auth-server'));
      el('auth-server').focus();
      return;
    }
    if (password.length < 8) {
      showAuthError('Password must be at least 8 characters');
      markFieldError(el('auth-password'));
      el('auth-password').focus();
      return;
    }

    state.serverUrl = parsed.origin;
    el('auth-server').value = state.serverUrl; // reflect any auto-correction (e.g. added http://) back to the user
    try {
      const path = state.mode === 'login' ? '/api/v1/auth/login' : '/api/v1/auth/register';
      const body = state.mode === 'login'
        ? { username, password }
        : { username: username || null, password };
      const auth = await api(path, { method: 'POST', body: JSON.stringify(body) });

      const entry = { url: state.serverUrl, token: auth.token, username: auth.username, name: null };
      const existingIdx = state.servers.findIndex((s) => s.url === entry.url && s.username === entry.username);
      if (existingIdx >= 0) {
        state.servers[existingIdx] = entry;
      } else {
        state.servers.push(entry);
      }
      saveServers();
      state.addingServer = false;
      await switchToServer(existingIdx >= 0 ? existingIdx : state.servers.length - 1);
    } catch (e) {
      showAuthError(`Could not reach ${state.serverUrl} — ${e.message}`);
      markFieldError(el('auth-server'));
    }
  });

  function banner(msg) {
    const b = el('banner');
    if (!msg) { b.classList.add('hidden'); return; }
    b.textContent = msg;
    b.classList.remove('hidden');
  }

  // --- Server rail / multi-server switching -------------------------------

  function renderServerRail() {
    const rail = el('server-rail');
    rail.innerHTML = '';
    state.servers.forEach((srv, i) => {
      const btn = document.createElement('div');
      btn.className = 'server-icon' + (i === state.activeServerIndex ? ' active' : '');
      const label = srv.name || srv.url.replace(/^https?:\/\//, '');
      btn.textContent = label.slice(0, 1).toUpperCase();
      btn.title = `${label} (${srv.username})`;
      btn.addEventListener('click', () => { if (i !== state.activeServerIndex) switchToServer(i); });
      rail.appendChild(btn);
    });
    const addBtn = document.createElement('div');
    addBtn.className = 'server-icon add';
    addBtn.textContent = '+';
    addBtn.title = 'Add another server';
    addBtn.addEventListener('click', showAddServerScreen);
    rail.appendChild(addBtn);
  }

  function showAddServerScreen() {
    state.addingServer = true;
    el('app').style.display = 'none';
    el('auth-screen').style.display = 'flex';
    el('auth-cancel').classList.toggle('hidden', state.servers.length === 0);
    el('auth-server').value = '';
    el('auth-username').value = '';
    el('auth-password').value = '';
    showAuthError('');
    clearFieldErrors();
    el('auth-server').focus();
  }

  async function switchToServer(index) {
    const srv = state.servers[index];
    if (!srv) return;
    if (state.ws) { state.ws.close(); state.ws = null; }
    if (state.voiceStatusTimer) { clearInterval(state.voiceStatusTimer); state.voiceStatusTimer = null; }
    state.activeServerIndex = index;
    state.serverUrl = srv.url;
    state.token = srv.token;
    state.username = srv.username;
    state.channels = [];
    state.activeChannel = null;
    state.typingTimers = {};
    localStorage.setItem('dissedoff_active_server_index', String(index));
    renderServerRail();
    try {
      await enterApp();
    } catch (e) {
      removeServer(index, `Could not connect to ${srv.name || srv.url} as ${srv.username}: ${e.message}`);
    }
  }

  function removeServer(index, reason) {
    state.servers.splice(index, 1);
    saveServers();
    if (state.servers.length > 0) {
      const next = Math.min(index, state.servers.length - 1);
      switchToServer(next);
    } else {
      state.activeServerIndex = -1;
      el('app').style.display = 'none';
      el('auth-screen').style.display = 'flex';
      el('auth-cancel').classList.add('hidden');
      renderServerRail();
    }
    if (reason) showAuthError(reason);
  }

  el('logout-btn').addEventListener('click', () => {
    if (state.activeServerIndex < 0) return;
    removeServer(state.activeServerIndex);
  });

  // --- Context menu (channels + messages) ----------------------------------

  function showContextMenu(x, y, items) {
    const menu = el('context-menu');
    menu.innerHTML = '';
    items.forEach(({ label, danger, onClick }) => {
      const div = document.createElement('div');
      div.className = 'item' + (danger ? ' danger' : '');
      div.textContent = label;
      div.addEventListener('click', () => { hideContextMenu(); onClick(); });
      menu.appendChild(div);
    });
    menu.style.left = x + 'px';
    menu.style.top = y + 'px';
    menu.classList.remove('hidden');
    requestAnimationFrame(() => {
      const rect = menu.getBoundingClientRect();
      if (rect.right > window.innerWidth) menu.style.left = Math.max(4, window.innerWidth - rect.width - 8) + 'px';
      if (rect.bottom > window.innerHeight) menu.style.top = Math.max(4, window.innerHeight - rect.height - 8) + 'px';
    });
  }
  function hideContextMenu() { el('context-menu').classList.add('hidden'); }
  document.addEventListener('click', hideContextMenu);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hideContextMenu(); });

  // --- Channels --------------------------------------------------------------

  async function loadServerInfo() {
    try {
      const info = await api('/api/v1/server');
      el('server-name').textContent = info.name;
      el('server-desc').textContent = info.description || '';
      if (state.activeServerIndex >= 0 && state.servers[state.activeServerIndex]) {
        state.servers[state.activeServerIndex].name = info.name;
        saveServers();
        renderServerRail();
      }
    } catch (e) {
      el('server-name').textContent = '(unavailable)';
    }
  }

  async function loadVoiceStatus() {
    try {
      const v = await api('/api/v1/voice/status');
      state.voicePort = v.port;
      const dot = v.enabled && v.running ? '#43b581' : v.enabled ? '#e0a040' : '#72767d';
      el('voice-status').innerHTML = `<span class="dot" style="background:${dot}"></span>voice: ${v.enabled ? (v.running ? `running on port ${v.port}` : 'starting...') : 'disabled'}`;
    } catch (e) {
      el('voice-status').textContent = 'voice: unavailable';
    }
  }

  async function loadChannels() {
    state.channels = await api('/api/v1/channels');
    const list = el('channel-list');
    list.innerHTML = '';
    if (!state.channels.length) {
      list.innerHTML = '<div style="color:var(--muted);font-size:0.8rem;padding:0.4rem 0.6rem;">no channels yet</div>';
      return;
    }
    if (!state.activeChannel || !state.channels.some((c) => c.id === state.activeChannel.id)) {
      state.activeChannel = state.channels[0];
    }
    state.channels.forEach((c) => {
      const div = document.createElement('div');
      div.className = 'channel' + (state.activeChannel && c.id === state.activeChannel.id ? ' active' : '');
      div.textContent = (c.kind === 'voice' ? '\u{1F50A} ' : '# ') + c.name;
      div.addEventListener('click', () => { state.activeChannel = c; refreshChannelView(); });
      div.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        showContextMenu(e.clientX, e.clientY, [
          { label: 'Rename channel', onClick: () => renameChannel(c) },
          { label: 'Delete channel', danger: true, onClick: () => deleteChannel(c) },
        ]);
      });
      list.appendChild(div);
    });
  }

  async function renameChannel(c) {
    const name = window.prompt('Rename channel', c.name);
    if (!name || !name.trim() || name.trim() === c.name) return;
    try {
      await api(`/api/v1/channels/${c.id}`, { method: 'PATCH', body: JSON.stringify({ name: name.trim() }) });
      await loadChannels();
      refreshChannelView();
    } catch (e) {
      banner(`could not rename channel: ${e.message}`);
    }
  }

  async function deleteChannel(c) {
    if (!window.confirm(`Delete #${c.name}? This cannot be undone.`)) return;
    try {
      await api(`/api/v1/channels/${c.id}`, { method: 'DELETE' });
      if (state.activeChannel && state.activeChannel.id === c.id) state.activeChannel = null;
      await loadChannels();
      refreshChannelView();
    } catch (e) {
      banner(`could not delete channel: ${e.message}`);
    }
  }

  el('new-channel-name').addEventListener('input', () => el('new-channel-name').classList.remove('input-error'));
  el('new-channel-name').addEventListener('keydown', (e) => { if (e.key === 'Enter') el('new-channel-submit').click(); });

  el('new-channel-submit').addEventListener('click', async () => {
    const input = el('new-channel-name');
    const name = input.value.trim();
    if (!name) {
      input.focus();
      input.classList.add('input-error');
      // restart the shake animation on repeat clicks (CSS animations don't
      // replay on an unchanged class unless it's removed and re-added)
      input.classList.remove('input-error');
      void input.offsetWidth;
      input.classList.add('input-error');
      return;
    }
    const kind = el('new-channel-kind').value;
    try {
      await api('/api/v1/channels', { method: 'POST', body: JSON.stringify({ name, kind }) });
      input.value = '';
      await loadChannels();
      refreshChannelView();
    } catch (e) {
      banner(`could not create channel: ${e.message}`);
    }
  });

  // --- Messages ----------------------------------------------------------

  function renderMessage(m) {
    const div = document.createElement('div');
    div.className = 'msg';
    div.dataset.messageId = m.id;
    const time = new Date(m.created_at * 1000).toLocaleTimeString();
    const editedTag = m.edited_at ? ' <span class="edited-tag">(edited)</span>' : '';
    div.innerHTML = `<span class="author">${escapeHtml(m.author_username)}</span><span class="time">${time}</span><br><span class="content">${escapeHtml(m.content)}</span>${editedTag}`;
    div.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      showContextMenu(e.clientX, e.clientY, [
        { label: 'Copy text', onClick: () => { (navigator.clipboard && navigator.clipboard.writeText(m.content)) || null; } },
        { label: 'Edit message', onClick: () => startEditMessage(div, m) },
        { label: 'Delete message', danger: true, onClick: () => deleteMessage(m) },
      ]);
    });
    return div;
  }

  function startEditMessage(div, m) {
    const contentSpan = div.querySelector('.content');
    if (!contentSpan) return;
    const input = document.createElement('input');
    input.className = 'edit-input';
    input.value = m.content;
    contentSpan.replaceWith(input);
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    let settled = false;
    const finish = async (save) => {
      if (settled) return;
      settled = true;
      if (save) {
        const newContent = input.value.trim();
        if (newContent && newContent !== m.content) {
          try {
            await api(`/api/v1/channels/${m.channel_id}/messages/${m.id}`, {
              method: 'PATCH',
              body: JSON.stringify({ content: newContent }),
            });
            return; // the MESSAGE_UPDATE gateway event re-renders this message in place
          } catch (e) {
            banner(`could not edit message: ${e.message}`);
          }
        }
      }
      const span = document.createElement('span');
      span.className = 'content';
      span.textContent = m.content;
      input.replaceWith(span);
    };
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') finish(true);
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(false));
  }

  async function deleteMessage(m) {
    if (!window.confirm('Delete this message?')) return;
    try {
      await api(`/api/v1/channels/${m.channel_id}/messages/${m.id}`, { method: 'DELETE' });
    } catch (e) {
      banner(`could not delete message: ${e.message}`);
    }
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  // --- Typing indicator ----------------------------------------------------

  function renderTyping() {
    const now = Date.now();
    Object.keys(state.typingTimers).forEach((u) => { if (state.typingTimers[u] <= now) delete state.typingTimers[u]; });
    const active = Object.keys(state.typingTimers);
    const indicator = el('typing-indicator');
    if (!active.length) { indicator.textContent = ''; return; }
    indicator.textContent = active.length === 1 ? `${active[0]} is typing...` : `${active.join(', ')} are typing...`;
  }

  function markTyping(username) {
    state.typingTimers[username] = Date.now() + 3000;
    renderTyping();
    setTimeout(renderTyping, 3100);
  }

  let lastTypingSent = 0;
  el('composer-input').addEventListener('input', () => {
    if (!state.activeChannel || state.activeChannel.kind !== 'text') return;
    const now = Date.now();
    if (now - lastTypingSent < 2500) return;
    lastTypingSent = now;
    api(`/api/v1/channels/${state.activeChannel.id}/typing`, { method: 'POST' }).catch(() => {});
  });

  // --- Channel view / voice panel -----------------------------------------

  async function refreshChannelView() {
    state.typingTimers = {};
    renderTyping();
    if (!state.activeChannel) {
      el('main-header').textContent = 'no channel selected';
      el('messages').innerHTML = '';
      el('voice-panel').classList.add('hidden');
      el('messages').classList.remove('hidden');
      el('composer').classList.remove('hidden');
      return;
    }
    const isVoice = state.activeChannel.kind === 'voice';
    el('main-header').textContent = (isVoice ? '\u{1F50A} ' : '# ') + state.activeChannel.name;
    document.querySelectorAll('.channel').forEach((d, i) => {
      d.classList.toggle('active', state.channels[i] && state.channels[i].id === state.activeChannel.id);
    });

    if (isVoice) {
      // Dissedoff's bundled Murmur voice server has no in-app join yet (see
      // PLAN.md Phase 2: the control-API proxy / VoiceStateUpdate bridging
      // that would let a click here actually connect audio doesn't exist).
      // Showing a fake "Join" button that does nothing would be worse than
      // this: give the real connection details for any standard Mumble
      // client instead, so voice is at least usable today.
      el('messages').classList.add('hidden');
      el('composer').classList.add('hidden');
      const panel = el('voice-panel');
      panel.classList.remove('hidden');
      let host = 'your-server';
      try { host = new URL(state.serverUrl).hostname; } catch (_) {}
      const port = state.voicePort || '64738';
      panel.innerHTML = `<div class="box">
        <h2>&#128266; ${escapeHtml(state.activeChannel.name)}</h2>
        <p>Dissedoff can't join voice in-browser/in-app yet &mdash; that bridging isn't built.
        Connect with any Mumble client instead, pointed at this server's bundled voice server:</p>
        <code>${escapeHtml(host)}:${escapeHtml(String(port))}</code>
        <p>Get a Mumble client: <a href="https://www.mumble.info/downloads/" target="_blank" rel="noopener">mumble.info/downloads</a></p>
      </div>`;
      banner('');
      return;
    }

    el('voice-panel').classList.add('hidden');
    el('messages').classList.remove('hidden');
    el('composer').classList.remove('hidden');
    try {
      const history = await api(`/api/v1/channels/${state.activeChannel.id}/messages`);
      const box = el('messages');
      box.innerHTML = '';
      history.slice().reverse().forEach((m) => box.appendChild(renderMessage(m)));
      box.scrollTop = box.scrollHeight;
      banner('');
    } catch (e) {
      banner(`could not load messages: ${e.message}`);
    }
  }

  el('composer-send').addEventListener('click', sendMessage);
  el('composer-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

  async function sendMessage() {
    const input = el('composer-input');
    const content = input.value.trim();
    if (!content || !state.activeChannel) return;
    try {
      await api(`/api/v1/channels/${state.activeChannel.id}/messages`, {
        method: 'POST',
        body: JSON.stringify({ content }),
      });
      input.value = '';
    } catch (e) {
      banner(`could not send: ${e.message}`);
    }
  }

  function connectGateway() {
    const wsUrl = state.serverUrl.replace(/^http/, 'ws') + '/api/v1/gateway?token=' + encodeURIComponent(state.token);
    const ws = new WebSocket(wsUrl);
    state.ws = ws;
    ws.onmessage = (ev) => {
      let envelope;
      try { envelope = JSON.parse(ev.data); } catch (_) { return; }
      if (envelope.t === 'HELLO') {
        const interval = envelope.d.heartbeat_interval_ms || 30000;
        ws._hb = setInterval(() => {
          ws.send(JSON.stringify({ t: 'HEARTBEAT', seq: 0, d: null }));
        }, interval);
      } else if (envelope.t === 'MESSAGE_CREATE') {
        const m = envelope.d;
        if (state.activeChannel && m.channel_id === state.activeChannel.id) {
          const box = el('messages');
          box.appendChild(renderMessage(m));
          box.scrollTop = box.scrollHeight;
        }
      } else if (envelope.t === 'MESSAGE_UPDATE') {
        const m = envelope.d;
        if (state.activeChannel && m.channel_id === state.activeChannel.id) {
          const existing = el('messages').querySelector(`[data-message-id="${CSS.escape(String(m.id))}"]`);
          if (existing) existing.replaceWith(renderMessage(m));
        }
      } else if (envelope.t === 'MESSAGE_DELETE') {
        const d = envelope.d;
        const existing = el('messages').querySelector(`[data-message-id="${CSS.escape(String(d.id))}"]`);
        if (existing) existing.remove();
      } else if (envelope.t === 'TYPING_START') {
        const d = envelope.d;
        if (state.activeChannel && d.channel_id === state.activeChannel.id && d.username !== state.username) {
          markTyping(d.username);
        }
      } else if (envelope.t === 'CHANNEL_CREATE') {
        loadChannels();
      } else if (envelope.t === 'CHANNEL_UPDATE') {
        loadChannels().then(refreshChannelView);
      } else if (envelope.t === 'CHANNEL_DELETE') {
        const wasActive = state.activeChannel && state.activeChannel.id === envelope.d.id;
        loadChannels().then(() => {
          if (wasActive) state.activeChannel = state.channels[0] || null;
          refreshChannelView();
        });
      }
    };
    ws.onclose = () => { if (ws._hb) clearInterval(ws._hb); };
  }

  async function enterApp() {
    el('auth-screen').style.display = 'none';
    el('app').style.display = 'block';
    el('whoami').textContent = state.username;
    renderServerRail();
    await loadServerInfo();
    await loadVoiceStatus();
    await loadChannels();
    await refreshChannelView();
    connectGateway();
    state.voiceStatusTimer = setInterval(loadVoiceStatus, 15000);
  }

  el('auth-server').value = state.serverUrl;

  if (state.servers.length > 0) {
    const saved = parseInt(localStorage.getItem('dissedoff_active_server_index'), 10);
    const startIndex = (Number.isInteger(saved) && state.servers[saved]) ? saved : 0;
    switchToServer(startIndex);
  } else {
    renderServerRail();
  }
})();
</script>
</body>
</html>
